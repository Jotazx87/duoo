<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recadinho do Jota ✨</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Canvas Confetti para a comemoração -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Fredoka', 'Nunito', sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 40%, #f3e8ff 100%);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Animações CSS */
        @keyframes gentleWave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-18deg); }
        }

        @keyframes gentleIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes wagTail {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.6; }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-cat-idle {
            animation: gentleIdle 3s infinite ease-in-out;
            transform-origin: bottom center;
        }

        .animate-wave-paw {
            animation: gentleWave 1.2s infinite ease-in-out;
            transform-origin: 130px 105px;
        }

        .animate-tail {
            animation: wagTail 1.5s infinite ease-in-out;
            transform-origin: 145px 140px;
        }

        .animate-eye {
            animation: blink 4s infinite;
            transform-origin: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 40px rgba(165, 180, 252, 0.25);
        }

        .floating-star {
            position: absolute;
            pointer-events: none;
            animation: floatUp linear infinite;
        }

        .btn-yes {
            background: linear-gradient(135deg, #818cf8 0%, #a78bfa 100%);
            box-shadow: 0 8px 20px rgba(129, 140, 248, 0.4);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
        }

        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 25px rgba(129, 140, 248, 0.6);
        }

        .btn-no {
            background: #ffffff;
            color: #6b7280;
            border: 2px solid #cbd5e1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: left 0.15s ease-out, top 0.15s ease-out, transform 0.15s ease;
            user-select: none;
            touch-action: none;
        }

        .btn-no:active {
            transform: scale(0.92);
        }

        .speech-bubble {
            position: relative;
            background: #ffffff;
            border-radius: 1.5rem;
            border: 3px solid #c7d2fe;
            box-shadow: 0 10px 25px rgba(199, 210, 254, 0.3);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 12px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -19px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 17px 14px 0;
            border-style: solid;
            border-color: #c7d2fe transparent;
            display: block;
            width: 0;
        }

        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative min-h-screen">

    <div id="stars-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Conteúdo Principal -->
    <main class="relative z-10 w-full max-w-md mx-auto text-center my-auto">
        <div class="glass-card rounded-3xl p-6 sm:p-8 relative">
            
            <!-- Balão de Fala do Gatinho -->
            <div class="speech-bubble p-5 mb-6 text-gray-800">
                <p class="text-base sm:text-lg font-bold leading-relaxed text-indigo-950">
                    "Oi moça, o jota me disse que a pessoa q ia acessar essa aba era uma pessoa muito incrivel e que era a melhor do mundo... é verdade isso?"
                </p>
                <p class="text-xs sm:text-sm text-indigo-500 font-semibold mt-3 italic">
                    (moça, clica no nao so pra vc ter uma experiencia)
                </p>
            </div>

            <div class="relative h-48 flex items-center justify-center mb-6">
                <div class="absolute bottom-2 w-32 h-5 bg-indigo-200/50 rounded-[100%] blur-sm"></div>

                <div class="animate-cat-idle relative">
                    <svg width="190" height="190" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-sm">
                        <!-- Rabo -->
                        <path class="animate-tail" d="M 140 145 C 165 135 178 95 160 80 C 150 70 140 85 148 95 C 155 105 145 128 130 138 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round"/>

                        <!-- Orelha Esquerda -->
                        <path d="M 52 75 L 32 30 L 78 52 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3.5" stroke-linejoin="round"/>
                        <path d="M 55 67 L 42 40 L 71 52 Z" fill="#A78BFA" opacity="0.6"/>
                        
                        <!-- Orelha Direita -->
                        <path d="M 148 75 L 168 30 L 122 52 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3.5" stroke-linejoin="round"/>
                        <path d="M 145 67 L 158 40 L 129 52 Z" fill="#A78BFA" opacity="0.6"/>

                        <!-- Corpo -->
                        <ellipse cx="100" cy="132" rx="48" ry="42" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3.5"/>
                        <ellipse cx="100" cy="135" rx="32" ry="28" fill="#FFFFFF"/>

                        <!-- Cabeça -->
                        <ellipse cx="100" cy="85" rx="48" ry="38" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3.5"/>

                        <!-- Patinha Esquerda -->
                        <ellipse cx="72" cy="122" rx="11" ry="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>

                        <!-- Patinhas Traseiras -->
                        <ellipse cx="62" cy="166" rx="14" ry="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
                        <ellipse cx="138" cy="166" rx="14" ry="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>

                        <!-- Patinha Direita Acenando -->
                        <g class="animate-wave-paw">
                            <path d="M 125 112 C 138 108 148 95 142 80 C 138 72 128 80 122 95 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3.5" stroke-linejoin="round"/>
                            <circle cx="142" cy="78" r="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
                            <circle cx="142" cy="78" r="4.5" fill="#C084FC" opacity="0.8"/>
                        </g>

                        <!-- Olhos -->
                        <g class="animate-eye">
                            <ellipse cx="78" cy="80" rx="5.5" ry="7.5" fill="#334155"/>
                            <circle cx="76" cy="77" r="2.2" fill="#FFFFFF"/>
                            
                            <ellipse cx="122" cy="80" rx="5.5" ry="7.5" fill="#334155"/>
                            <circle cx="120" cy="77" r="2.2" fill="#FFFFFF"/>
                        </g>

                        <!-- Bochechas -->
                        <ellipse cx="68" cy="88" rx="6" ry="3.5" fill="#F472B6" opacity="0.4"/>
                        <ellipse cx="132" cy="88" rx="6" ry="3.5" fill="#F472B6" opacity="0.4"/>

                        <!-- Narizinho -->
                        <polygon points="97,85 103,85 100,89" fill="#A78BFA"/>

                        <!-- Boca Feliz -->
                        <path d="M 94 91 Q 97 95 100 92 Q 103 95 106 91" stroke="#475569" stroke-width="2.2" stroke-linecap="round" fill="none"/>

                        <!-- Bigodes -->
                        <line x1="48" y1="82" x2="32" y2="80" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
                        <line x1="48" y1="87" x2="34" y2="89" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
                        <line x1="152" y1="82" x2="168" y2="80" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
                        <line x1="152" y1="87" x2="166" y2="89" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <div id="buttonArea" class="relative min-h-[60px] flex items-center justify-center gap-4">
                <!-- Botão SIM -->
                <button onclick="showGifModal()" 
                        class="btn-yes text-white font-bold py-3 px-8 rounded-full text-lg cursor-pointer flex items-center justify-center gap-2 z-10">
                    <i class="fa-solid fa-sparkles"></i>
                    <span>Sim!</span>
                </button>

                <!-- Botão NÃO -->
                <button id="btnNo" 
                        onclick="moveButton(event)"
                        ontouchstart="moveButton(event)"
                        class="btn-no font-bold py-3 px-8 rounded-full text-lg cursor-pointer z-10">
                    Não
                </button>
            </div>

        </div>
    </main>

    <!-- Modal com o GIF do Gatinho Embutido em Data URL -->
    <div id="gifModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center relative animate-pop border-4 border-indigo-200">
            
            <h2 class="text-2xl font-bold text-indigo-950 mb-2">SABIA!! 🎉</h2>
            <p class="text-sm text-indigo-600 font-semibold mb-4">Você é mesmo a melhor pessoa do mundo! ✨</p>
            
            <!-- GIF Mochi Peach Cat Embutido diretamente -->
            <div class="relative flex justify-center items-center my-4">
                <img id="embeddedGif" 
                     src="https://media.tenor.com/J1y1WnS8U6YAAAAC/mochi-peachcat-cute-cat.gif" 
                     alt="Mochi Peach Cat Happy Dance" 
                     class="w-56 h-56 object-contain rounded-2xl drop-shadow-md mx-auto" />
            </div>

            <button onclick="closeGifModal()" class="btn-yes text-white font-bold py-2.5 px-6 rounded-full text-base cursor-pointer mt-3">
                Voltar 😁
            </button>
        </div>
    </div>

    <script>
        // Criar elementos flutuantes ao fundo
        function createBackgroundElements() {
            const container = document.getElementById('stars-container');
            const icons = ['fa-star', 'fa-sparkles', 'fa-heart', 'fa-moon'];
            const colors = ['#818cf8', '#a78bfa', '#c084fc', '#60a5fa', '#cbd5e1'];

            for (let i = 0; i < 22; i++) {
                const element = document.createElement('i');
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                
                element.className = `fa-solid ${randomIcon} floating-star`;
                element.style.left = `${Math.random() * 100}%`;
                element.style.color = colors[Math.floor(Math.random() * colors.length)];
                element.style.fontSize = `${Math.random() * 14 + 10}px`;
                element.style.animationDuration = `${Math.random() * 8 + 5}s`;
                element.style.animationDelay = `${Math.random() * 5}s`;
                
                container.appendChild(element);
            }
        }

        let clickCount = 0;

        // Mover o botão "Não" com travamento absoluto dentro da tela
        function moveButton(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            const btn = document.getElementById('btnNo');
            btn.style.position = 'fixed';

            // Medidas exatas da tela visível
            const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
            const viewportHeight = document.documentElement.clientHeight || window.innerHeight;

            // Tamanho real do botão
            const btnWidth = btn.offsetWidth || 100;
            const btnHeight = btn.offsetHeight || 48;

            // Margem de segurança de 24px das bordas da tela
            const padding = 24;

            // Limites mínimos e máximos calculados
            const minX = padding;
            const maxX = Math.max(minX, viewportWidth - btnWidth - padding);

            const minY = padding;
            const maxY = Math.max(minY, viewportHeight - btnHeight - padding);

            // Geração de posição aleatória com trava matemática estrita
            const randomX = Math.random() * (maxX - minX) + minX;
            const randomY = Math.random() * (maxY - minY) + minY;

            const finalX = Math.min(Math.max(randomX, minX), maxX);
            const finalY = Math.min(Math.max(randomY, minY), maxY);

            btn.style.left = `${finalX}px`;
            btn.style.top = `${finalY}px`;

            // Mudanças do texto do botão
            clickCount++;
            if (clickCount === 1) {
                btn.innerText = "Ué? Clicou? 😂";
            } else if (clickCount === 2) {
                btn.innerText = "Errou de novo! 😜";
            } else if (clickCount === 4) {
                btn.innerText = "Nem tenta! 🙈";
            } else if (clickCount === 7) {
                btn.innerText = "Clica no Sim! ✨";
            }
        }

        // Exibir Modal com o GIF e soltar confetes
        function showGifModal() {
            const modal = document.getElementById('gifModal');
            modal.classList.remove('hidden');

            // Disparar chuva de confetes
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#818cf8', '#a78bfa', '#f472b6', '#38bdf8']
                });
            }
        }

        // Fechar Modal
        function closeGifModal() {
            const modal = document.getElementById('gifModal');
            modal.classList.add('hidden');
        }

        // Inicializar estrelas ao carregar
        window.addEventListener('DOMContentLoaded', () => {
            createBackgroundElements();
        });
    </script>
</body>
</html>
